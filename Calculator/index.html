<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather&family=Orbitron:wght@500&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather&family=Orbitron:wght@500&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">

        <form class="calculator" name="calc">

            <input type="text" class="values" name="text" placeholder="0000000">

            <span class="clear" onclick="calc.text.value=''"> <b>C</b> </span>
            <span class="ao" onclick="calc.text.value+='()'"> <b>( )</b> </span>
            <span class="ao" onclick="calc.text.value+='%'"> <b>%</b> </span>
            <span class="ao" onclick="calc.text.value+='/'"> <b>÷</b> </span>
            <span class="num" onclick="calc.text.value+='7'"> <b>7</b> </span>
            <span class="num" onclick="calc.text.value+='8'"> <b>8</b> </span>
            <span class="num" onclick="calc.text.value+='9'"> <b>9</b> </span>
            <span class="ao" onclick="calc.text.value+='*'"> <b>×</b> </span>
            <span class="num" onclick="calc.text.value+='4'"> <b>4</b> </span>
            <span class="num" onclick="calc.text.value+='5'"> <b>5</b> </span>
            <span class="num" onclick="calc.text.value+='6'"> <b>6</b> </span>
            <span class="ao" onclick="calc.text.value+='-'"> <b>—</b> </span>
            <span class="num" onclick="calc.text.value+='1'"> <b>1</b> </span>
            <span class="num" onclick="calc.text.value+='2'"> <b>2</b> </span>
            <span class="num" onclick="calc.text.value+='3'"> <b>3</b> </span>
            <span class="ao" onclick="calc.text.value+='+'"> <b>+</b> </span>
            <span class="num" onclick="calc.text.value+='.'"> <b>.</b> </span>
            <span class="num" onclick="calc.text.value+='0'"> <b>0</b> </span>
            <span class="num" onclick="calc.text.value+='00'"> <b>00</b> </span>


            <span class="equal" onclick="document.calc.text.value=eval(calc.text.value)
            "> <b>= </b></span>

        </form>


    </div>



</body>

</html>
